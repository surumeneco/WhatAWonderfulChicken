name: Read-only trap source snapshot
on:
  push:
    branches:
      - infra/chat-trap-snapshot-20261114
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a62ceb7c97d41e7f3be6bb4ce12f405bace1982f
          persist-credentials: false
          fetch-depth: 1
      - name: Capture verified tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshot
          git archive --format=tar HEAD | gzip -n > snapshot/project.tar.gz
          echo "surumeneco/WhatAWonderfulChicken" > snapshot/repository.txt
          git rev-parse HEAD > snapshot/commit.txt
          git rev-parse HEAD^{tree} > snapshot/tree.txt
          sha256sum snapshot/project.tar.gz > snapshot/tar-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: trap-source-WhatAWonderfulChicken
          path: snapshot/
          retention-days: 1
