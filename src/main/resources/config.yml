stats:
  range-change-policy: preserve-value
  max-health:
    min: 10.0
    max: 30.0
    display: rank
  size:
    min: 1.5
    max: 3.0
    display: rank
  ground-speed:
    min: 3.0
    max: 24.0
    display: rank
  air-speed:
    min: 3.0
    max: 24.0
    display: rank
  ascent-speed:
    min: 1.0
    max: 5.0
    display: rank
  jump-strength:
    min: 1.0
    max: 5.0
    display: rank
  step-height:
    min: 0.5
    max: 1.5
    display: rank
  stamina:
    min: 2.0
    max: 20.0
    display: rank
  stamina-recovery:
    min: 0.5
    max: 3.0
    display: rank
nature:
  adjustment: 0.10
natural-spawn:
  chance: 0.05
  max-normalized: 1.5
  distribution:
    mean: 0.42
    standard-deviation: 0.22
breeding:
  stat-mutation-rate: 0.01
  genetic-mutation-rate: 0.01
  direct-inheritance-rate: 0.40
  gaussian:
    spread-factor: 0.25
    minimum-standard-deviation: 0.03
traits:
  haste-radius: 7.5
  alert-radius: 20.0
  alert-min-interval-ticks: 10
  alert-max-interval-ticks: 80
  egg-gold-chance: 0.05
  egg-netherite-conditional-chance: 0.01
flight:
  stamina-consumption-per-second: 1.0
  recovery-delay-seconds: 1.0
feeding:
  heal-per-seed: 2.0
road:
  speed-multiplier: 1.25
  check-interval-ticks: 5
  blocks:
    - minecraft:white_wool
    - minecraft:orange_wool
    - minecraft:magenta_wool
    - minecraft:light_blue_wool
    - minecraft:yellow_wool
    - minecraft:lime_wool
    - minecraft:pink_wool
    - minecraft:gray_wool
    - minecraft:light_gray_wool
    - minecraft:cyan_wool
    - minecraft:purple_wool
    - minecraft:blue_wool
    - minecraft:brown_wool
    - minecraft:green_wool
    - minecraft:red_wool
    - minecraft:black_wool
follow:
  teleport-distance: 16.0
storage:
  persist-current-stamina: true
commands:
  info-max-results: 10
# 既存Genome / Phenotype Snapshotには遡及せず、現在実効値にのみ反映されるruntime設定です。
runtime:
  age:
    # 生物学的時刻の基準ワールド。存在するワールド名を指定します。
    # 別ワールドへの変更時は時間差を吸収して連続する日齢を保ちます。
    clock-world: world
    # 成体化後の成長・全盛・老化期間。単位: Minecraft game day (24000 tick)。
    # 0以上。値を大きくするとそれぞれの段階が長くなります。reload後の計算から反映されます。
    base-growth-game-days: 672.0
    base-peak-duration-game-days: 2880.0
    base-aging-duration-game-days: 4320.0
    # 年齢補正の能力別感受性。0で年齢の影響なし。正の値が大きいほど影響が増えます。
    # 怪我の重症度やGenomeの基礎能力値は変更しません。
    sensitivity:
      max-health: 0.7
      size: 0.0
      ground-speed: 1.0
      air-speed: 0.8
      ascent-speed: 1.0
      jump-strength: 1.0
      step-height: 0.4
      stamina: 0.7
      stamina-recovery: 0.5

# チキントラップは新月かつ晴天のゲーム内時刻18000に一度だけ抽選します。
# 時刻スキップでは抽選せず、23000に到達すれば残存個体は消滅します。
chicken-trap:
  # 0.01 = 1%。範囲 0.0～1.0。reload後の次の抽選から反映します。
  spawn-chance: 0.01
  # 待機中のSkeletonが近づくプレイヤーに反応する半径。単位:block、0より大きい値。
  activation-radius-blocks: 10.0
